<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- GitHub Pages cannot set custom response headers, so enforce the browser-
       supported policy here. HSTS, X-Content-Type-Options and frame-ancestors
       still belong at the CDN/proxy layer; see README.md. -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; base-uri 'none'; object-src 'none'; script-src 'self' https://cdn.jsdelivr.net; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob: https://tiles.openfreemap.org https://assets.getpartiful.com https://*.giphy.com https://firebasestorage.googleapis.com https://storage.googleapis.com https://*.appspot.com; connect-src 'self' https://tiles.openfreemap.org; font-src 'self' data:; worker-src 'self' blob:; frame-src 'none'; form-action 'self' mailto:; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Cafés — Boston Café Bikers</title>
  <meta name="description" content="Café we've visited.">
  <link rel="canonical" href="https://cafebikers.org/cafes.html">
  <meta property="og:title" content="Cafés — Boston Café Bikers">
  <meta property="og:description" content="Café we've visited.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://cafebikers.org/cafes.html">
  <meta property="og:image" content="https://cafebikers.org/images/boston-cafe-bikers-logo.jpeg">
  <meta property="og:image:alt"
    content="The Boston Café Bikers logo: the word Boston with a bicycle for its o's, over “café bikers”, on a sky-blue background.">
  <meta name="theme-color" content="#4a2c1a">
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 32'%3E%3Crect x='2' y='7' width='14' height='17' rx='2.5' fill='%23b07a4a'/%3E%3Cpath d='M16 11 h3.5 a4.5 4.5 0 0 1 0 9 h-3.5' fill='none' stroke='%23b07a4a' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='16' r='10' fill='none' stroke='%23b07a4a' stroke-width='3.5'/%3E%3Cline x1='32' y1='6' x2='32' y2='26' stroke='%23b07a4a' stroke-width='3'/%3E%3Cline x1='22' y1='16' x2='42' y2='16' stroke='%23b07a4a' stroke-width='3'/%3E%3Ccircle cx='32' cy='16' r='2.2' fill='%23b07a4a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <!-- Not defer'd: nav.js sets html.has-js before first paint so the phone
       nav is already collapsed to its hamburger on the first frame. -->
  <script src="js/nav.js"></script>
  <!-- MapLibre GL JS 6.10.0 (BSD-3-Clause), upgraded past the 6.4.1 security
       fix and vendored because v6 is an ES-module graph rather than one UMD
       file. cafes.js imports it only when a map can be drawn, so a module/WebGL
       failure still leaves the café list intact. See vendor/maplibre-gl-6.10.0/
       LICENSE.txt and js/cafes.js. -->
  <link rel="stylesheet" href="vendor/maplibre-gl-6.10.0/maplibre-gl.css">
  <style>
    /* --- cafés-page styles (shared base lives in styles.css) --- */

    /* Global safety net, same as the rides page: nothing may override the
       UA's [hidden] rule (the count line starts hidden). */
    [hidden] {
      display: none !important;
    }

    .note {
      color: var(--muted);
      font-size: .9rem;
    }

    #cafe-count {
      margin: 0 0 .5rem;
      font-weight: 600;
      color: var(--roast);
    }

    /* --- the café map --- */

    /* Starts hidden and is revealed by cafes.js only once MapLibre has loaded,
       the style has been fetched AND at least one café has coordinates, so a
       CDN outage or an empty cache leaves no grey box sitting above the list. */
    .cafe-map {
      height: 340px;
      margin: 0 0 1rem;
      border: 1px solid var(--oat);
      border-radius: var(--radius);
      /* The map canvas is square-cornered; the radius only bites if the box
         clips it. */
      overflow: hidden;
      /* What shows through while the map is still arriving. */
      background: var(--oat);
    }

    @media (min-width: 560px) {
      .cafe-map {
        height: 420px;
      }
    }

    /* One pin per café. cafes.js hands MapLibre this <button> as the marker
       element, so the colours live here with the rest of the palette instead
       of being read back out of the stylesheet in JS. 18px across: a map pin
       is conventionally small, but a finger still has to land on it — and much
       bigger and the downtown cafés merge into one blob at the opening zoom. */
    .cafe-pin {
      width: 18px;
      height: 18px;
      padding: 0;
      border: 2px solid var(--roast);
      border-radius: 50%;
      background: var(--crema);
      cursor: pointer;
      /* A pale halo so a pin over water or a park still has an edge. */
      box-shadow: 0 0 0 1px rgba(255, 250, 244, .7);
    }

    /* MapLibre's popup in the café palette, so it reads as one of our cards. */
    .maplibregl-popup-content {
      background: var(--foam);
      color: var(--ink);
      border-radius: 10px;
      padding: 12px 14px;
      /* MapLibre sizes the bubble from this; wide enough for an address line. */
      min-width: 180px;
      box-shadow: 0 2px 10px rgba(46, 29, 19, .18);
    }

    /* The little triangle is a CSS border, so its colour lives on whichever
       side faces the pin — and that depends on where the bubble ended up. */
    .maplibregl-popup-anchor-top .maplibregl-popup-tip,
    .maplibregl-popup-anchor-top-left .maplibregl-popup-tip,
    .maplibregl-popup-anchor-top-right .maplibregl-popup-tip {
      border-bottom-color: var(--foam);
    }

    .maplibregl-popup-anchor-bottom .maplibregl-popup-tip,
    .maplibregl-popup-anchor-bottom-left .maplibregl-popup-tip,
    .maplibregl-popup-anchor-bottom-right .maplibregl-popup-tip {
      border-top-color: var(--foam);
    }

    .maplibregl-popup-anchor-left .maplibregl-popup-tip {
      border-right-color: var(--foam);
    }

    .maplibregl-popup-anchor-right .maplibregl-popup-tip {
      border-left-color: var(--foam);
    }

    .maplibregl-popup-close-button {
      width: 30px;
      height: 30px;
      font-size: 1.1rem;
      color: var(--muted);
      border-radius: 0 10px 0 10px;
    }

    /* OpenFreeMap asks for its credit and OpenStreetMap's, and the tiles ship
       both; keep the line small enough to sit on a 380px map without pushing
       the zoom buttons around. */
    .maplibregl-ctrl-attrib.maplibregl-compact-show,
    .maplibregl-ctrl-bottom-right .maplibregl-ctrl-attrib {
      font-size: 10px;
      line-height: 1.35;
      max-width: 100%;
    }

    .pin-name {
      font-size: 1rem;
      margin: 0 0 .15rem;
    }

    .pin-address {
      color: var(--muted);
      font-size: .85rem;
      margin: 0 0 .4rem;
    }

    .pin-rides {
      list-style: none;
      margin: 0 0 .4rem;
      padding: 0;
      font-size: .9rem;
    }

    .pin-rides li {
      margin: 0 0 .2rem;
    }

    /* Both popup links are the touch target, so give them real height. The
       colour is spelled out rather than inherited: a map library that ships
       its own `a` colour (Leaflet did, #0078A8) would otherwise outrank
       styles.css and leave bright blue links in the middle of the palette. */
    .pin-rides a,
    .pin-directions a {
      display: inline-block;
      padding: 3px 0;
      font-weight: 600;
      color: var(--roast);
    }

    .pin-directions {
      margin: 0;
      padding-top: .3rem;
      border-top: 1px solid var(--oat);
    }

    /* Keyboard-focus ring in the palette, matching styles.css's :focus-visible
       convention. It earns its place here because MapLibre moves focus into a
       popup as it opens, so the ring shows on an ordinary mouse click too —
       and the browser's default blue is the one colour the map got rid of. */
    .cafe-pin:focus-visible,
    .pin-rides a:focus-visible,
    .pin-directions a:focus-visible,
    .maplibregl-popup-close-button:focus-visible {
      outline: 2px solid var(--roast);
      outline-offset: 2px;
    }

    /* One h2 per year, so a long list still says at a glance which season
       you're scrolling through. */
    .year {
      font-size: 1.25rem;
      color: var(--roast);
      margin: 1.6rem 0 .6rem;
      padding-bottom: .3rem;
      border-bottom: 1px solid var(--oat);
    }

    .year:first-child {
      margin-top: 1rem;
    }

    .cafe-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 12px;
    }

    /* Same card treatment as the ride cards and the .links tiles. */
    .cafe {
      background: var(--foam);
      border: 1px solid var(--oat);
      border-radius: var(--radius);
      padding: 14px 16px;
    }

    .cafe-name {
      font-size: 1.1rem;
      margin: 0 0 .2rem;
      /* A long café name must wrap rather than push the card past a 380px
         phone — same rule the ride card's .where keeps. */
      overflow-wrap: anywhere;
    }

    .cafe-address {
      color: var(--muted);
      font-size: .95rem;
      margin: 0 0 .4rem;
      overflow-wrap: anywhere;
    }

    .cafe-address.is-unknown {
      font-style: italic;
    }

    .cafe-when {
      margin: 0;
      font-weight: 600;
      color: var(--roast);
      text-transform: uppercase;
      font-size: .78rem;
      letter-spacing: .06em;
    }

    .cafe-ride {
      margin: .25rem 0 0;
    }

    .cafe-go {
      margin: .45rem 0 0;
    }

    .cafe-go a {
      font-weight: 600;
      /* The line is the touch target; the padding keeps it off the card edge. */
      display: inline-block;
      padding: 4px 0;
    }

    /* The back link matches the contact page's: the ride-card action-row
       build, full-width on a phone and a pill from 560px up. */
    .btn-back {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 10px 18px;
      font-weight: 600;
      width: 100%;
      margin-top: 1.5rem;
    }

    @media (min-width: 560px) {
      .btn-back {
        width: auto;
      }
    }
  </style>
</head>
