name: Set up Python
description: >
  Install the repo's pinned Python and (by default) its requirements. One
  definition shared by ci.yml, sync.yml and meta-integration.yml.

inputs:
  install-deps:
    description: Run pip install -r requirements.txt
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: requirements.txt

    - name: Install dependencies
      if: inputs.install-deps == 'true'
      shell: bash
      run: pip install -r requirements.txt
