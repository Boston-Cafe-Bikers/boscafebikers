name: Sync rides

on:
  schedule:
    # Every 6 hours, on the hour (UTC).
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run the pipeline but write nothing (the summary shows what it would have done)"
        type: boolean
        default: false

# One sync at a time: two runs must never race a push to the data branch.
concurrency:
  group: sync-rides
  cancel-in-progress: false

jobs:
  # There is one copy of generated site data on the orphan `data` branch,
  # laid out exactly like site/. So there is one sync job: it runs the
  # code from whichever ref triggered it and writes the data next door.
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      # Bare checkout — this workflow's own ref. The cron runs master's
      # scripts/; `gh workflow run sync.yml --ref dev` runs dev's, which is how
      # a pipeline change is tried on real data before it is merged.
      - name: Check out the code
        uses: actions/checkout@v4

      # The data, beside the code. Second, because a checkout into the
      # workspace root wipes anything already sitting there.
      - name: Check out the generated site data
        uses: actions/checkout@v4
        with:
          ref: data
          path: _data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Thirty seconds of insurance before anything touches generated data: this
      # runs the triggering ref's scripts/, and dev is where half-finished code
      # lives. The suite is offline (it parses tests/fixtures/sample.ics with a
      # pinned clock), so it needs no secret and cannot flake on the network.
      # ci.yml runs the same command on every push; this is the gate for the
      # cron, which pushes without one.
      - name: Check the scripts before touching ride data
        run: python -m pytest tests/ -q

      # ubuntu-latest does not ship ImageMagick. Ride posters are fail-soft
      # without it, while the Instagram cache deliberately requires it so the
      # data branch holds small metadata-stripped JPEGs rather than originals.
      - name: Install ImageMagick for the image thumbnails
        run: |
          if ! command -v magick >/dev/null && ! command -v convert >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends imagemagick >/dev/null
          fi
          (magick -version || convert -version) | head -1

      # The whole pipeline in one process: fetch, archive, backfill, geocode,
      # draw the missing maps, publish, re-export the calendar. The order lives
      # in scripts/sync.py's STEPS and tests/test_sync.py reorders that tuple to
      # prove each rule still bites. The script writes a file only when its
      # content changed, so a quiet sync leaves zero bytes for the commit step
      # to find. The secret reaches this step and no other, and never as a CLI
      # argument (arguments show up in logs).
      - name: Sync the ride data
        id: sync
        env:
          PARTIFUL_ICS_URL: ${{ secrets.PARTIFUL_ICS_URL }}
          DRY_RUN: ${{ github.event.inputs.dry-run }}
        run: |
          set -uo pipefail
          args=(--data-dir _data)
          if [ "${DRY_RUN:-false}" = "true" ]; then
            args+=(--dry-run)
          fi
          log="$RUNNER_TEMP/sync.log"
          status=0
          python scripts/sync.py "${args[@]}" >"$log" 2>&1 || status=$?
          cat "$log"
          # The run page should say what the pipeline did without anyone opening
          # the step log — this is the whole point of a dry run.
          {
            echo "### \`scripts/sync.py ${args[*]}\`"
            echo ''
            echo '```'
            cat "$log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # The browser must never see the Meta token. Fetch the nine newest posts
      # here, mirror their display images into _data/instagram/, and publish
      # only same-origin paths in instagram-posts.json. A Meta outage or an
      # expired token must not block ride updates: the last successful gallery
      # cache stays on the data branch and this step is visibly fail-soft.
      - name: Sync the Instagram gallery
        id: instagram
        continue-on-error: true
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry-run }}
        run: |
          set -uo pipefail
          args=(--data-dir _data --limit 9)
          if [ "${DRY_RUN:-false}" = "true" ]; then
            args+=(--dry-run)
          fi
          log="$RUNNER_TEMP/instagram.log"
          status=0
          python scripts/sync_instagram.py "${args[@]}" >"$log" 2>&1 || status=$?
          cat "$log"
          {
            echo "### \`scripts/sync_instagram.py ${args[*]}\`"
            echo ''
            echo '```'
            cat "$log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # Committed inside _data, so the only thing this workflow ever writes is
      # the data branch — no bot commit interleaves with the code history.
      - name: Commit the generated data if changed
        id: commit
        if: ${{ github.event.inputs.dry-run != 'true' }}
        working-directory: _data
        run: |
          # Stage first, then diff the index: the route maps are *new* files,
          # and a plain `git diff` doesn't see untracked ones.
          git add -A .
          if git diff --cached --quiet; then
            echo "No ride changes; nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync site data from Partiful and Instagram"
          # Plain `git push`: actions/checkout left _data tracking `data`.
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # The push above uses GITHUB_TOKEN, which deliberately does not fire `push`
  # workflow triggers — so Pages would never redeploy. Call the deploy workflow
  # ourselves instead, and only when the rides actually changed. One call
  # republishes both trees: pages.yml checks master, dev and data out by name
  # and overlays the data onto each.
  deploy:
    needs: sync
    if: ${{ !cancelled() && needs.sync.outputs.changed == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
